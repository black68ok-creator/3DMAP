<title>멍 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- PROTOTYPE - NOT FOR PRODUCTION | Question: 함께 앉아 장소 소리를 들으면 더 오래 머무는가? (artifact room transport) | Date: 2026-11-02 -->
<style>
  /* Layout: one narrow column — map list, then a single room view; night palette by design */
  :root {
    --bg:#13181c; --card:#1d252b; --line:#2b353d; --ink:#dde3e7; --dim:#86939b; --warm:#ffb860; --warm-soft:#ffe0b0; --btn:#28323a; --btn-on:#4a3a22; --btn-on-ink:#ffd9a8;
    --display:"Gowun Batang", "Apple SD Gothic Neo", serif; --body:"Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    color-scheme: dark;
  }
  body { background:var(--bg); color:var(--ink); font-family:var(--body); }
  .wrap { max-width:520px; margin:0 auto; padding-block:16px 32px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-direction:column; gap:12px; }
  h1 { font-family:var(--display); font-size:24px; font-weight:700; margin:8px 0 0; text-wrap:balance; }
  .sub { color:var(--dim); font-size:13px; line-height:1.5; }
  .spots { display:flex; flex-direction:column; gap:10px; }
  .spot { background:var(--card); border:1px solid transparent; border-radius:14px; padding:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; color:inherit; font:inherit; text-align:left; cursor:pointer; width:100%; }
  .spot:hover, .spot:focus-visible { border-color:var(--line); outline:none; }
  .spot .name { font-family:var(--display); font-size:17px; }
  .spot .desc { color:var(--dim); font-size:12px; margin-top:4px; }
  .spot > div:first-child { min-width:0; }
  .lights { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; min-width:64px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--warm); box-shadow:0 0 10px var(--warm); }
  .empty { color:var(--dim); font-size:12px; white-space:nowrap; }
  canvas { width:100%; max-width:100%; aspect-ratio:4/3; background:#0c1013; border-radius:14px; display:block; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button.b { background:var(--btn); color:var(--ink); border:0; border-radius:10px; padding:10px 14px; font:inherit; font-size:14px; cursor:pointer; }
  button.b.on { background:var(--btn-on); color:var(--btn-on-ink); }
  button.b:focus-visible { outline:2px solid var(--warm); outline-offset:2px; }
  .timer { font-size:30px; font-variant-numeric:tabular-nums; text-align:center; letter-spacing:0.04em; }
  .note { color:var(--dim); font-size:12px; line-height:1.5; }
  .status { color:var(--dim); font-size:12px; }
  @media (prefers-reduced-motion: reduce) { .dot { box-shadow:none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">

<div class="wrap">
  <section id="map">
    <h1>멍 지도</h1>
    <p class="sub">불빛 하나는 지금 그 자리에 앉아 있는 사람 한 명입니다. 이 페이지를 연 사람들끼리 보입니다.</p>
    <div class="spots" id="spots"></div>
    <p class="note" id="records"></p>
    <p class="status" id="status">연결 중…</p>
  </section>
  <section id="room" hidden>
    <h1 id="roomName"></h1>
    <p class="sub">아무것도 안 해도 됩니다. 소리는 켜고 끌 수 있어요.</p>
    <canvas id="cv" width="800" height="600"></canvas>
    <div class="timer" id="timer">00:00</div>
    <div class="row" id="layers"></div>
    <div class="row">
      <button class="b" id="nod" type="button">끄덕</button>
      <button class="b" id="leave" type="button">일어나기</button>
    </div>
  </section>
</div>

<script>
// PROTOTYPE - NOT FOR PRODUCTION
const SPOTS = {
  cvs:    { name: '비 오는 편의점 앞', desc: '처마 끝 낙수, 냉장고 웅웅, 멀리 지나가는 차', seats: 6, layers: ['빗소리', '처마 낙수', '냉장고', '지나가는 차'] },
  temple: { name: '새벽 산사', desc: '산바람, 풍경 소리, 멀리 목탁, 새벽 새', seats: 6, layers: ['산바람', '풍경', '목탁', '새소리'] },
};
let room = null;
const statusEl = document.getElementById('status');
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const records = store.get('meong-proto-records', []);

function others() { return room ? room.peers().filter((p) => !p.sameTab) : []; }
function bySpot() {
  const out = {};
  const list = room ? room.peers() : [];
  for (const p of list) { const s = p.presence && p.presence.spot; if (typeof s === 'string' && SPOTS[s]) (out[s] ||= []).push(p); }
  if (current && !room) (out[current.id] ||= []).push({ sameTab: true, presence: { spot: current.id, seat: current.seat } });
  return out;
}

function render() {
  const a = bySpot();
  const box = document.getElementById('spots');
  box.textContent = '';
  for (const [id, s] of Object.entries(SPOTS)) {
    const n = (a[id] || []).length;
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'spot';
    const left = document.createElement('div');
    const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = s.name;
    const ds = document.createElement('div'); ds.className = 'desc'; ds.textContent = s.desc;
    left.append(nm, ds);
    const lights = document.createElement('div'); lights.className = 'lights';
    if (n) for (let i = 0; i < Math.min(n, 12); i++) { const d = document.createElement('span'); d.className = 'dot'; lights.append(d); }
    else { const e = document.createElement('span'); e.className = 'empty'; e.textContent = '비어 있음'; lights.append(e); }
    el.append(left, lights);
    el.onclick = () => enter(id);
    box.append(el);
  }
  const total = records.reduce((t, r) => t + r.sec, 0);
  document.getElementById('records').textContent = records.length
    ? `내 기록: ${records.length}번 앉음 · 총 ${Math.round(total / 60)}분 · 함께 앉은 최대 ${Math.max(...records.map((r) => r.maxWith))}명`
    : '';
}
// ---------- Sound (Web Audio synthesis) ----------
let ac, master;
function noiseBuffer() {
  const b = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function noiseSrc() { const s = ac.createBufferSource(); s.buffer = noiseBuffer(); s.loop = true; s.start(); return s; }
function filt(type, f, q = 1) { const x = ac.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; }
function gainNode(v) { const g = ac.createGain(); g.gain.value = v; return g; }

function makeLayer(kind) {
  const out = gainNode(0); out.connect(master);
  const timers = [];
  const ping = (fn, minMs, maxMs) => { const loop = () => { fn(); timers.push(setTimeout(loop, minMs + Math.random() * (maxMs - minMs))); }; loop(); };
  const blip = (freq, dur, vol, type = 'sine', dest = out) => {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = gainNode(0); o.connect(g); g.connect(dest);
    const t = ac.currentTime; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  };
  switch (kind) {
    case '빗소리': { const n = noiseSrc(); const f = filt('lowpass', 2500); const h = filt('highpass', 400); n.connect(h); h.connect(f); f.connect(gainNode(0.5)).connect(out); break; }
    case '처마 낙수': ping(() => blip(900 + Math.random() * 900, 0.08, 0.25, 'triangle'), 250, 1400); break;
    case '냉장고': { [55, 110, 165].forEach((fr, i) => { const o = ac.createOscillator(); o.frequency.value = fr; o.connect(gainNode(0.08 / (i + 1))).connect(out); o.start(); }); break; }
    case '지나가는 차': { const n = noiseSrc(); const f = filt('lowpass', 300); const g = gainNode(0); n.connect(f); f.connect(g); g.connect(out);
      ping(() => { const t = ac.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.6, t + 3); g.gain.linearRampToValueAtTime(0, t + 7); }, 9000, 20000); break; }
    case '산바람': { const n = noiseSrc(); const f = filt('bandpass', 500, 0.7); const g = gainNode(0.4); n.connect(f); f.connect(g); g.connect(out);
      const lfo = ac.createOscillator(); lfo.frequency.value = 0.07; const lg = gainNode(0.3); lfo.connect(lg); lg.connect(g.gain); lfo.start(); break; }
    case '풍경': ping(() => { const base = [1318, 1568, 1760, 2093][Math.floor(Math.random() * 4)]; blip(base, 3.5, 0.12); blip(base * 2.76, 1.2, 0.03); }, 3000, 9000); break;
    case '목탁': ping(() => { blip(420, 0.15, 0.35, 'sine'); blip(840, 0.05, 0.1, 'square'); }, 2200, 2600); break;
    case '새소리': ping(() => { const o = ac.createOscillator(); const g = gainNode(0); o.connect(g); g.connect(out); const t = ac.currentTime;
      o.frequency.setValueAtTime(3000, t); o.frequency.exponentialRampToValueAtTime(4200, t + 0.12); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05, t + 0.02); g.gain.linearRampToValueAtTime(0, t + 0.15); o.start(t); o.stop(t + 0.2); }, 4000, 12000); break;
  }
  return { set(on) { out.gain.setTargetAtTime(on ? 1 : 0, ac.currentTime, 0.8); }, stop() { timers.forEach(clearTimeout); out.disconnect(); } };
}

let current = null, layers = [], raf = null, myNod = -1e9, lastNod = 0;
function enter(id) {
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = gainNode(0.8); master.connect(ac.destination); }
  ac.resume();
  const taken = new Set((bySpot()[id] || []).map((p) => p.presence.seat));
  let seat = 0; while (taken.has(seat) && seat < SPOTS[id].seats - 1) seat++;
  current = { id, seat, start: Date.now(), maxWith: (bySpot()[id] || []).filter((p) => !p.sameTab).length };
  document.getElementById('map').hidden = true;
  document.getElementById('room').hidden = false;
  document.getElementById('roomName').textContent = SPOTS[id].name;
  const box = document.getElementById('layers'); box.textContent = '';
  layers = SPOTS[id].layers.map((name, i) => {
    const l = makeLayer(name); const on = i < 2; l.set(on);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'b' + (on ? ' on' : ''); b.textContent = name;
    b.setAttribute('aria-pressed', String(on));
    b.onclick = () => { const v = !b.classList.contains('on'); b.classList.toggle('on', v); b.setAttribute('aria-pressed', String(v)); l.set(v); };
    box.append(b); return l;
  });
  if (room) room.presence({ spot: id, seat, nodAt: null }).catch(() => {});
  draw();
}
function leave() {
  const sec = Math.round((Date.now() - current.start) / 1000);
  records.push({ spot: current.id, sec, maxWith: current.maxWith, at: Date.now() });
  store.set('meong-proto-records', records);
  layers.forEach((l) => l.stop()); cancelAnimationFrame(raf);
  current = null;
  if (room) room.presence({ spot: null, seat: null, nodAt: null }).catch(() => {});
  document.getElementById('room').hidden = true;
  document.getElementById('map').hidden = false;
  render();
}
document.getElementById('leave').onclick = leave;
document.getElementById('nod').onclick = () => {
  if (Date.now() - lastNod < 5000) return; lastNod = Date.now();
  myNod = performance.now();
  if (room) room.presence({ nodAt: Date.now() }).catch(() => {});
};

function draw() {
  const cv = document.getElementById('cv'), g = cv.getContext('2d');
  const W = cv.width, H = cv.height, t = performance.now();
  const people = bySpot()[current.id] || [];
  current.maxWith = Math.max(current.maxWith, people.filter((p) => !p.sameTab).length);
  g.fillStyle = '#0c1013'; g.fillRect(0, 0, W, H);
  const br = 0.5 + 0.5 * Math.sin(t / 5000 * Math.PI * 2);
  g.fillStyle = `rgba(80,110,130,${0.08 + br * 0.05})`; g.fillRect(0, 0, W, H);
  const seats = SPOTS[current.id].seats;
  for (let i = 0; i < seats; i++) {
    const x = W * (0.15 + 0.7 * (i / (seats - 1))), y = H * 0.62;
    g.fillStyle = '#222b31'; g.fillRect(x - 30, y + 18, 60, 10);
    const p = people.find((q) => q.presence.seat === i) || (i === current.seat ? { sameTab: true, presence: {} } : null);
    if (!p) continue;
    const isMe = p.sameTab;
    const nodRecent = isMe ? t - myNod < 1500 : (typeof p.presence.nodAt === 'number' && Date.now() - p.presence.nodAt < 1500);
    const bob = nodRecent ? Math.sin((t % 1500) / 1500 * Math.PI * 2) * 8 : 0;
    const grd = g.createRadialGradient(x, y, 0, x, y, 70);
    grd.addColorStop(0, isMe ? 'rgba(255,214,150,0.55)' : 'rgba(255,184,96,0.55)'); grd.addColorStop(1, 'rgba(255,184,96,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, 70, 0, Math.PI * 2); g.fill();
    g.fillStyle = isMe ? '#ffe0b0' : '#ffb860'; g.beginPath(); g.arc(x, y - 10 + bob, 14, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(x, y + 14, 16, 12, 0, 0, Math.PI * 2); g.fill();
  }
  const sec = Math.floor((Date.now() - current.start) / 1000);
  document.getElementById('timer').textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  raf = requestAnimationFrame(draw);
}

render();
(async () => {
  try { room = window.claude && window.claude.use ? await window.claude.use('room') : null; } catch { room = null; }
  if (!room) { statusEl.textContent = '함께 보기에 연결할 수 없어 혼자 보기로 열렸습니다.'; return; }
  room.onPeers(() => { if (!current) render(); }, () => { statusEl.textContent = '함께 보기 연결이 끊겼습니다.'; });
  room.onConnection((c) => { statusEl.textContent = c ? `연결됨 · 지금 이 페이지를 연 사람 ${room.peers().length}명` : '연결 중…'; });
  setInterval(() => { if (room.connected()) statusEl.textContent = `연결됨 · 지금 이 페이지를 연 사람 ${room.peers().length}명`; }, 5000);
})();
</script>
